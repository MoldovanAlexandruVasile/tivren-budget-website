<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="phone.css" />
<style id="fonts"></style>
<style>
  /* The social card (og:image), 1200×630: what a shared link to the site shows. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Jakarta, sans-serif; background: #f2f5f0; color: #111814; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 640px; height: 560px; right: -120px; top: -180px; background: #aeeecb; opacity: .75; }
  .b2 { width: 520px; height: 440px; left: -200px; bottom: -240px; background: #b7e4c7; opacity: .55; }
  .b3 { width: 300px; height: 300px; left: 420px; top: 60px; background: #f2c14b; opacity: .14; }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; color: #1b4332; }
  .brand img { width: 72px; height: 72px; border-radius: 17px; box-shadow: 0 14px 30px -14px rgba(1, 45, 29, .5); }
  h1 { font-size: 66px; line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; }
  h1 .accent { background: linear-gradient(90deg, #1b4332, #2d6a4f 55%, #52b788); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .soon { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; background: #d8f3e4; color: #1f5a40; font: 700 22px/1 Inter; }
  .soon i { width: 11px; height: 11px; border-radius: 50%; background: #52b788; box-shadow: 0 0 0 6px rgba(82, 183, 136, .25); }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="copy">
  <div class="brand"><img src="../public/icon.png" alt="" />Tivren Budget</div>
  <h1>Your household budget,<br><span class="accent">finally calm.</span></h1>
  <span class="soon"><i></i>Coming soon to iPhone and Android</span>
</div>
<div class="phone" style="--w:330px;left:790px;top:70px"><div class="glass"><img src="raw/en/home.png"><div class="island"></div></div></div>
<script>
  window.setFonts = (fonts) => {
    document.getElementById("fonts").textContent = Object.entries(fonts).map(([key, url]) => {
      const [family, weight] = key.split("-");
      return `@font-face { font-family: ${family}; font-weight: ${weight}; src: url("${url}"); }`;
    }).join("\n");
  };
</script>
</body>
</html>
